<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bunny Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, sans-serif;
      }

      body {
        margin: 0;
        min-width: 332px;
        background: #f8fafc;
        color: #0f172a;
      }

      .panel {
        padding: 16px;
      }

      .group {
        margin-top: 12px;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #ffffff;
        padding: 12px;
      }

      .group:first-of-type {
        margin-top: 0;
      }

      .group-title {
        margin: 0 0 8px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #0f172a;
      }

      .title {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 700;
      }

      .subtitle {
        margin: 0 0 12px;
        font-size: 11px;
        line-height: 1.5;
        color: #475569;
      }

      .toggle-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 14px;
      }

      .toggle-copy {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .toggle-label {
        font-size: 12px;
        font-weight: 700;
      }

      .toggle-status {
        font-size: 11px;
        color: #64748b;
      }

      .switch {
        appearance: none;
        -webkit-appearance: none;
        position: relative;
        display: inline-block;
        flex: 0 0 auto;
        width: 46px;
        height: 28px;
        padding: 0;
        border: none;
        border-radius: 999px;
        background: #cbd5e1;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      .switch::after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 22px;
        height: 22px;
        border-radius: 999px;
        background: #ffffff;
        transition: transform 0.2s ease;
        box-shadow: 0 1px 3px rgba(15, 23, 42, 0.25);
      }

      .switch[data-enabled="true"] {
        background: #dc2626;
      }

      .switch[data-enabled="true"]::after {
        transform: translateX(18px);
      }

      .meta {
        margin-top: 10px;
        padding: 10px 12px;
        border-radius: 12px;
        background: #fff1f2;
        color: #9f1239;
        font-size: 11px;
        line-height: 1.5;
      }

      .meta.connected {
        background: #ecfdf5;
        color: #166534;
      }

      .meta.browser {
        background: #eff6ff;
        color: #1d4ed8;
      }

      .field {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .inline-field {
        margin-top: 10px;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        gap: 10px;
      }

      .inline-field .field-label {
        margin: 0;
        white-space: nowrap;
      }

      .field-label {
        font-size: 11px;
        font-weight: 700;
        color: #334155;
      }

      .field-help {
        font-size: 11px;
        color: #64748b;
        line-height: 1.5;
      }

      .text-input {
        height: 36px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        color: #0f172a;
        background: #ffffff;
      }

      .textarea {
        min-height: 84px;
        resize: vertical;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 10px 12px;
        font: inherit;
        font-size: 12px;
        line-height: 1.5;
        color: #0f172a;
        background: #ffffff;
      }

      .select-input {
        height: 36px;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 0 10px;
        font: inherit;
        font-size: 12px;
        color: #0f172a;
        background: #ffffff;
      }

      .actions {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .action-button {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: #dc2626;
        color: #ffffff;
        padding: 10px 12px;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }

      .action-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1 class="title">Bunny Assistant</h1>
      <p class="subtitle">Để em giúp các anh debug ra nhanh hơn.</p>
      <section class="group">
        <h2 class="group-title">Browser Debug Tools</h2>
        <div class="toggle-row" style="padding:0;">
          <div class="toggle-copy">
            <span class="toggle-label">Show Debug Controls</span>
            <span class="toggle-status">Runs directly on the game page.</span>
          </div>
          <button id="debug-toggle-button" class="switch" data-enabled="false" aria-pressed="false" type="button"></button>
        </div>
        <div class="inline-field">
          <label class="field-label" for="cheat-speed">Cheat Speed</label>
          <input id="cheat-speed" class="text-input" type="number" min="0.1" step="0.1" placeholder="1.0" />
        </div>
        <div id="browser-meta" class="meta browser">Browser debug tools are ready.</div>
        <div class="field">
          <label class="field-label" for="custom-origins">Custom Links</label>
          <p class="field-help">One origin per line. Reload the target tab after saving.</p>
          <textarea id="custom-origins" class="textarea" placeholder="https://your-domain.example"></textarea>
        </div>
      </section>
      <section class="group">
        <h2 class="group-title">Filter Logs</h2>
        <div class="field" style="margin-top:0;">
          <label class="field-label" for="debug-exclude-list">Exclude List</label>
          <textarea id="debug-exclude-list" class="textarea" style="min-height:136px;" placeholder="One filter per line"></textarea>
        </div>
        <div class="field">
          <label class="field-label" for="debug-highlight-list">Highlight List</label>
          <textarea id="debug-highlight-list" class="textarea" placeholder="One filter per line"></textarea>
        </div>
        <div class="inline-field">
          <label class="field-label" for="debug-highlight-color">Highlight Color</label>
          <select id="debug-highlight-color" class="select-input">
            <option value="red">Red</option>
            <option value="amber">Amber</option>
            <option value="cyan">Purple</option>
          </select>
        </div>
      </section>
    </div>
    <script src="popup.js"></script>
  </body>
  </html>
