name: Build App

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: dist
          if-no-files-found: error

  package-electron:
    name: Package Electron (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run release:mac -- --publish never

      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run build && npx electron-builder --linux --publish never

      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run build && npx electron-builder --win --publish never

      - name: Upload Electron package
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ runner.os }}
          path: release
          if-no-files-found: error
